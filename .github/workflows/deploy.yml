name: Deploy PrintSafe Cloud to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Production Code
        uses: actions/checkout@v5

      - name: Validate Secrets & Configure SSH
        run: |
          if [ -z "${{ secrets.CPANEL_HOST }}" ] || [ -z "${{ secrets.CPANEL_USERNAME }}" ] || [ -z "${{ secrets.CPANEL_SSH_KEY }}" ]; then
            echo "❌ ERROR: Required GitHub Secrets are missing!"
            exit 1
          fi

          SSH_PORT="${{ secrets.CPANEL_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Files via Tar over SSH (No Rsync Needed)
        run: |
          SSH_PORT="${{ secrets.CPANEL_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"

          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.env' \
              --exclude='*.db' \
              --exclude='*.sqlite3' \
              --exclude='documents' \
              --exclude='venv' \
              --exclude='tmp' \
              --exclude='__pycache__' \
              -czf - . | ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" \
              "mkdir -p '${{ secrets.CPANEL_APP_PATH }}' && tar -xzf - -C '${{ secrets.CPANEL_APP_PATH }}'"

      - name: Install Dependencies & Hard Restart Python App
        env:
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          PIP_PATH: ${{ secrets.CPANEL_PIP_PATH }}
        run: |
          SSH_PORT="${{ secrets.CPANEL_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"

          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" "
            set -e
            cd '$APP_PATH'
            mkdir -p documents tmp public
            '$PIP_PATH' install -r requirements.txt --quiet

            # 1. Official cPanel UAPI Restart (same as clicking Stop/Start in cPanel UI)
            uapi PassengerApps restart_app app_root='$APP_PATH' >/dev/null 2>&1 || true

            # 2. Kill any lingering Passenger Python workers so next request boots fresh
            VENV_BIN=\$(dirname '$PIP_PATH')
            pkill -f \"\$VENV_BIN/python\" >/dev/null 2>&1 || true

            # 3. Standard Passenger restart trigger
            touch tmp/restart.txt
            echo '✅ Deployment & Hard Restart Completed!'
          "