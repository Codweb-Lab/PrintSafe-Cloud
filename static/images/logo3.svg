            <!-- Drop Shadow Filters for 3D Depth Perception -->
            <filter id="vectorDropShadow" x="-10%" y="-10%" width="130%" height="130%">
              <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
            </filter>
          </defs>

