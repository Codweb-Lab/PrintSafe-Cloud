            <!-- Cyber Laser Pulse Status LED Indicators -->
            <circle cx="19" cy="39" r="2.5" fill="#22c55e"/>
            <circle cx="26" cy="39" r="1.8" fill="#38bdf8"/>

            <!-- Secure Decrypted Paper Output Feed -->
            <path d="M 22 44 L 56 44 L 53 62 C 53 63, 52 64, 51 64 L 27 64 C 26 64, 25 63, 25 62 Z" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
            <line x1="28" y1="50" x2="50" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
            <line x1="28" y1="55" x2="46" y2="55" stroke="#cbd5e1" stroke-width="1.5"/>

            <!-- Bold Glossy 3D Cyber Security Lock -->
            <path d="M 55 42 L 55 35 C 55 29, 66 29, 66 35 L 66 42" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
            <path d="M 55 42 L 55 35 C 55 29, 66 29, 66 35 L 66 42" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
            <rect x="50" y="40" width="21" height="17" rx="4" fill="url(#cyberLockGrad)" stroke="#451a03" stroke-width="1.2"/>
            <circle cx="60.5" cy="47" r="2.2" fill="#0f172a"/>
            <path d="M 60.5 48.5 L 60.5 53.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
            <path d="M 52 42 L 69 42" stroke="#fef08a" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
