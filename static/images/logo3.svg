            <line x1="30" y1="26" x2="48" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
            <line x1="30" y1="31" x2="42" y2="31" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

