<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Cloud Background Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Printer Body Gradient -->
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Lock Gold Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Text Print Gradient -->
    <linearGradient id="textPrintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. CLOUD PRINTER ICON LAYER (Scaled & Aligned) -->
  <!-- ========================================== -->
  <g transform="translate(10, 5) scale(0.95)">
    <!-- Main Cloud Shape Backdrop -->
    <path d="M 45 22 C 38 22, 35 27, 32 29 C 26 21, 10 23, 8 36 C 2 37, 0 43, 3 49 C 5 54, 11 55, 15 55 L 65 55 C 72 55, 75 49, 73 44 C 75 36, 70 29, 62 29 C 59 21, 49 22, 45 22 Z" fill="url(#cloudGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 45 24 C 48 24, 57 23, 60 31 C 68 31, 72 37, 71 43 C 69 48, 66 53, 60 53 L 15 53 C 10 53, 6 51, 5 46 C 3 42, 5 38, 9 37 C 11 26, 24 23, 31 31 C 34 27, 39 24, 45 24 Z" fill="#7dd3fc" opacity="0.3"/>

    <!-- Top Paper Asset Feed -->
    <path d="M 28 25 L 50 25 L 50 38 L 28 38 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="32" y1="29" x2="46" y2="29" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="32" y1="33" x2="42" y2="33" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Main Printer Body Framework -->
    <path d="M 18 36 L 60 36 C 63 36, 65 38, 65 41 L 65 54 C 65 57, 63 59, 60 59 L 18 59 C 15 59, 13 57, 13 54 L 13 41 C 13 38, 15 36, 18 36 Z" fill="url(#printerGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Light Accent Plate -->
    <path d="M 19 38 L 59 38 C 60 38, 61 39, 61 40 L 61 44 C 61 45, 60 46, 59 46 L 19 46 C 18 46, 17 45, 17 44 L 17 40 C 17 39, 18 38, 19 38 Z" fill="#475569"/>

    <!-- Dynamic Status Ledger Bulbs -->
    <circle cx="21" cy="42" r="2" fill="#22c55e"/>
    <circle cx="26" cy="42" r="1.5" fill="#94a3b8"/>

    <!-- Front Paper Target Output Emitter -->
    <path d="M 24 46 L 54 46 L 51 63 L 27 63 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <line x1="29" y1="52" x2="49" y2="52" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="29" y1="57" x2="45" y2="57" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Secure Padlock Guard Overlay -->
    <!-- Lock Shackle Hoop -->
    <path d="M 54 44 L 54 39 C 54 34, 64 34, 64 39 L 64 44" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 44 L 55 40 C 55 36, 63 36, 63 40 L 63 44" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <!-- Lock Brass Body Block -->
    <rect x="50" y="43" width="18" height="15" rx="3" fill="url(#lockGrad)" stroke="#78350f" stroke-width="1.5"/>
    <!-- Keyhole Crypt Center Node -->
    <circle cx="59" cy="49" r="2" fill="#1e293b"/>
    <path d="M 59 50 L 59 54" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. BRAND TEXT TYPOGRAPHY LAYER            -->
  <!-- ========================================== -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
    <!-- PrintSafe (With Solid Gradient Vector Theme) -->
    <text x="95" y="52" font-size="38" font-weight="700" fill="url(#textPrintGrad)" letter-spacing="-0.5">PrintSafe</text>
    
    <!-- Cloud (With Modern Deep Slate/Charcoal Tint) -->
    <text x="268" y="52" font-size="38" font-weight="600" fill="#334155" letter-spacing="-0.5">Cloud</text>
    
    <!-- Version Structural Layout Dividers -->
    <text x="382" y="50" font-size="28" font-weight="300" fill="#94a3b8">|</text>
    <text x="400" y="49" font-size="20" font-weight="500" fill="#64748b" letter-spacing="0.5">v0.1.0</text>
  </g>
</svg>