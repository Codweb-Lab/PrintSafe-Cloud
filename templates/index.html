<!doctype html>
<html lang="en" data-theme="light" data-style="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PrintSafe Cloud {{ app_version }} | NextGen Vault</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo3.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vault_core.css') }}?v=1.0" />
  </head>
  <body>
    <div id="app-wrapper">
      <!-- 1. Modular Sidebar -->
      {% include 'partials/sidebar.html' %}

      <main class="explorer-viewport">
        <!-- 2. Modular Top Header -->
        {% include 'partials/header.html' %}

        <!-- 3. Main Explorer Workspace -->
        <div id="file-manager-dashboard" class="dashboard-viewport-split" style="display: flex;">
          <div class="category-view-pane">
            
            <div class="quick-filter-pills-bar">
              <div class="pills-left">
                <div class="filter-pill active" onclick="applyQuickTypeFilter('all', this)"><i class="ri-apps-2-line"></i> All Items</div>
                <div class="filter-pill" onclick="applyQuickTypeFilter('pdf', this)"><i class="ri-file-pdf-2-line"></i> PDFs</div>
                <div class="filter-pill" onclick="applyQuickTypeFilter('image', this)"><i class="ri-image-line"></i> Images</div>
                <div class="filter-pill" id="pill-print-queue" onclick="applyQuickTypeFilter('print_queue', this)">
                  <i class="ri-printer-cloud-line"></i> To Be Printed
                  <span class="queue-count-badge" id="pill-print-queue-count">0</span>
                </div>
              </div>

              <div class="theme-segmented-control" title="Switch Tile / List View">
                <button class="theme-icon-btn active" id="view-btn-tile" onclick="setExplorerViewMode('tile')" title="Tile Grid View">
                  <i class="ri-layout-grid-fill"></i>
                </button>
                <button class="theme-icon-btn" id="view-btn-list" onclick="setExplorerViewMode('list')" title="Detailed List View">
                  <i class="ri-list-check-2"></i>
                </button>
              </div>
            </div>

            <div class="navigation-toolbar">
              <div class="nav-trail-box">
                <button id="back-folder-btn" class="navigation-back-btn" onclick="navigateBackFolder()" style="display: none;">
                  <i class="ri-arrow-left-line"></i> Back
                </button>
                <span id="current-folder-path-display" class="current-path-text">Root Vault</span>
              </div>

              <!-- 🔤 MODERN CUSTOM SORT DROPDOWN -->
              <div class="filters-toolbar-compact">
                <div class="modern-dropdown" id="dropdown-sort-by">
                  <input type="hidden" id="drive-sort-by" value="name-asc" />
                  <button type="button" class="modern-dropdown-trigger" onclick="toggleModernDropdown('dropdown-sort-by', event)">
                    <i class="ri-sort-asc" id="sort-trigger-icon" style="color:var(--accent);font-size:15px;"></i>
                    <span id="sort-trigger-label">Name (A-Z)</span>
                    <i class="ri-arrow-down-s-line dropdown-chevron"></i>
                  </button>
                  <div class="modern-dropdown-menu">
                    <div class="dropdown-menu-caption">Sort Directory By</div>
                    <div class="modern-dropdown-item active" data-value="name-asc" onclick="selectModernSort('name-asc', 'Name (A-Z)', 'ri-sort-asc', this)">
                      <div class="dd-item-left"><i class="ri-sort-asc"></i> <span>Name (A to Z)</span></div>
                      <i class="ri-check-line dd-check"></i>
                    </div>
                    <div class="modern-dropdown-item" data-value="name-desc" onclick="selectModernSort('name-desc', 'Name (Z-A)', 'ri-sort-desc', this)">
                      <div class="dd-item-left"><i class="ri-sort-desc"></i> <span>Name (Z to A)</span></div>
                      <i class="ri-check-line dd-check"></i>
                    </div>
                    <div class="modern-dropdown-item" data-value="size-asc" onclick="selectModernSort('size-asc', 'Smallest First', 'ri-scales-2-line', this)">
                      <div class="dd-item-left"><i class="ri-scales-2-line"></i> <span>Size (Smallest)</span></div>
                      <i class="ri-check-line dd-check"></i>
                    </div>
                    <div class="modern-dropdown-item" data-value="size-desc" onclick="selectModernSort('size-desc', 'Largest First', 'ri-scales-fill', this)">
                      <div class="dd-item-left"><i class="ri-scales-fill"></i> <span>Size (Largest)</span></div>
                      <i class="ri-check-line dd-check"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="file-grid" id="main-explorer-grid"></div>
          </div>

          <div class="integrated-preview-column">
            <div id="integrated-preview-pane" style="height: 100%; display: flex; flex-direction: column;">
              <div class="preview-header">
                <div class="preview-title" id="preview-filename-display">Document Preview</div>
                <div class="preview-actions">
                  <button class="btn-action-view" onclick="toggleFullscreenPane()" title="Fullscreen"><i class="ri-fullscreen-line"></i></button>
                  <button class="btn-action-view" id="print-action-btn" style="display: none;" onclick="triggerCleanVectorPrint()"><i class="ri-printer-line"></i> Print</button>
                  <button class="btn-action-view" onclick="closePreviewPane()" style="color:#ef4444;"><i class="ri-close-line"></i> Close</button>
                </div>
              </div>
              <div class="preview-body-scroll" id="preview-raster-pages-area"></div>
            </div>
          </div>

          <!-- Floating Action Cluster -->
          <input type="file" id="vault-file-uploader" style="display: none;" accept=".pdf,.jpg,.jpeg,.png,.webp,.ipynb" multiple onchange="handleCurrentFolderUpload(event)" />
          <div class="floating-fab-cluster">
            <button id="mobile-floating-disconnect-btn" class="fab-action-btn disc" onclick="disconnectAllConnectedDesktops()" title="Logout Connected Desktops">
              <i class="ri-computer-line"></i>
              <i class="ri-shut-down-line" style="margin-left:-4px;font-size:14px;"></i>
              <span class="fab-label">Kill Desktops</span>
            </button>

            <button id="mobile-floating-qr-btn" class="fab-action-btn qr" onclick="openMobileScannerFromDashboard()" title="Scan Desktop QR">
              <i class="ri-qr-scan-2-line"></i>
            </button>

            <button id="floating-upload-fab" class="fab-action-btn upload" onclick="document.getElementById('vault-file-uploader').click()" title="Upload Files to Current Folder">
              <i class="ri-upload-cloud-2-fill" style="font-size:19px;"></i>
              <span class="fab-label">Upload Here</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- 4. Modular Overlays & Modals -->
    {% include 'partials/modals.html' %}

    <!-- 5. Global Footer -->
    {% include 'partials/footer.html' %}

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="{{ url_for('static', filename='js/pdf.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/state.js') }}?v=1.0"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}?v=2.2"></script>
    <script src="{{ url_for('static', filename='js/explorer.js') }}?v=1.0"></script>
    <script src="{{ url_for('static', filename='js/preview.js') }}?v=1.0"></script>
    <script src="{{ url_for('static', filename='js/cloud_admin.js') }}?v=2.2"></script>
  </body>
</html>
