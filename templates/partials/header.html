<header class="bento-top-header">
  <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
    <button class="mobile-menu-trigger" onclick="toggleMobileSidebar(true)">
      <i class="ri-menu-2-line"></i>
    </button>
    <div class="bento-search-bar">
      <i class="ri-search-2-line"></i>
      <input type="text" id="drive-search-input" placeholder="Search files or folders..." oninput="renderCurrentFolderLevel()" />
    </div>
  </div>

  <div class="bento-header-actions">
    <div class="restricted-badge" id="restricted-mode-indicator" title="Logged in via QR in Read & Print Mode">
      <i class="ri-shield-keyhole-line"></i> Restricted QR Mode
    </div>

    <button class="connected-devices-pill master-only-nav" onclick="openConnectedDevicesModal(true)" title="Manage Connected QR Devices & Restrictions">
      <span class="dot"></span>
      <i class="ri-computer-line"></i>
      <span id="header-connected-count">0</span>
    </button>

    <!-- 🔔 NOTIFICATION CENTER BELL WITH ANCHORED POPOVER DROPDOWN -->
    <div class="notification-popover-wrapper" style="position: relative;">
      <button id="header-notif-bell-btn" class="connected-devices-pill" onclick="toggleNotificationPopover(event)" title="Notifications">
        <i class="ri-notification-3-line" style="color:var(--accent);font-size:15px;"></i>
        <span id="header-notif-badge" style="background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;display:none;">0</span>
      </button>

      <div id="notification-popover-dropdown" class="modern-profile-popover" style="display: none; width: 320px; max-width: calc(100vw - 24px); padding: 0; overflow: hidden;">
        <div style="padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg-app);">
          <div style="font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--text-title);">
            <i class="ri-notification-3-fill" style="color: var(--accent);"></i> Notifications
          </div>
          <button type="button" onclick="markAllNotificationsRead(event)" style="background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer;">
            Mark all read
          </button>
        </div>
        <div id="notifications-list-container" style="max-height: 310px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
          <div style="text-align:center;color:var(--text-sub);padding:18px;font-size:12.5px;">Loading notifications...</div>
        </div>
      </div>
    </div>

    <!-- 🎨 MODERN CUSTOM UI DESIGN SYSTEM DROPDOWN -->
    <div class="modern-dropdown" id="dropdown-ui-style">
      <input type="hidden" id="ui-style-selector" value="glass" />
      <button type="button" class="modern-dropdown-trigger" onclick="toggleModernDropdown('dropdown-ui-style', event)" title="Switch UI Architecture">
        <i class="ri-palette-line" style="color:var(--accent);font-size:15px;"></i>
        <span id="ui-style-label">Glass Bento</span>
        <i class="ri-arrow-down-s-line dropdown-chevron"></i>
      </button>
      <div class="modern-dropdown-menu">
        <div class="dropdown-menu-caption">UI Design System</div>
        <div class="modern-dropdown-item active" data-value="glass" onclick="selectModernUIStyle('glass', 'Glass Bento', this)">
          <div class="dd-item-left"><i class="ri-sparkling-2-line" style="color:#3b82f6;"></i> <span>Glass Bento</span></div>
          <i class="ri-check-line dd-check"></i>
        </div>
        <div class="modern-dropdown-item" data-value="cloudly" onclick="selectModernUIStyle('cloudly', 'Cloudly Bento', this)">
          <div class="dd-item-left"><i class="ri-folder-5-fill" style="color:#FF8132;"></i> <span>Cloudly Bento</span></div>
          <i class="ri-check-line dd-check"></i>
        </div>
        <div class="modern-dropdown-item" data-value="fluent" onclick="selectModernUIStyle('fluent', 'Microsoft Fluent', this)">
          <div class="dd-item-left"><i class="ri-windows-fill" style="color:#0078d4;"></i> <span>Microsoft Fluent</span></div>
          <i class="ri-check-line dd-check"></i>
        </div>
        <div class="modern-dropdown-item" data-value="carbon" onclick="selectModernUIStyle('carbon', 'IBM Carbon', this)">
          <div class="dd-item-left"><i class="ri-terminal-box-line" style="color:#0f62fe;"></i> <span>IBM Carbon</span></div>
          <i class="ri-check-line dd-check"></i>
        </div>
        <div class="modern-dropdown-item" data-value="cyber" onclick="selectModernUIStyle('cyber', 'Cyber Neon', this)">
          <div class="dd-item-left"><i class="ri-flashlight-fill" style="color:#00f5d4;"></i> <span>Cyber Neon</span></div>
          <i class="ri-check-line dd-check"></i>
        </div>
      </div>
    </div>

    <!-- 🌗 3-OPTION ICON THEME MODE SWITCHER -->
    <div class="theme-segmented-control">
      <button class="theme-icon-btn" id="theme-btn-light" onclick="setThemeMode('light')" title="Light Mode"><i class="ri-sun-line"></i></button>
      <button class="theme-icon-btn" id="theme-btn-dark" onclick="setThemeMode('dark')" title="Dark Mode"><i class="ri-moon-clear-line"></i></button>
      <button class="theme-icon-btn" id="theme-btn-system" onclick="setThemeMode('system')" title="System Default"><i class="ri-computer-line"></i></button>
    </div>

    <!-- 👤 MODERN PROFILE DROPDOWN -->
    <div class="profile-dropdown-wrapper" style="position: relative;">
      <div class="profile-avatar-pill" id="header-user-avatar" onclick="toggleProfileDropdown()">U</div>
      
      <div id="profile-menu-dropdown" class="modern-profile-popover" style="display: none;">
        <div style="padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px;">
          <div id="dropdown-user-name" style="font-weight: 700; font-size: 13.5px; color: var(--text-title);">User</div>
          <div id="dropdown-user-email" style="font-size: 11px; color: var(--text-sub);">user@printsafe.cloud</div>
        </div>
        <div class="modern-dropdown-item" onclick="openUserProfileModal()">
          <div class="dd-item-left"><i class="ri-user-settings-line" style="color:var(--accent);"></i> <span>My Profile</span></div>
        </div>
        <div class="modern-dropdown-item" onclick="togglePasswordModal(true)">
          <div class="dd-item-left"><i class="ri-shield-keyhole-line" style="color:#10b981;"></i> <span>Password, PIN &amp; 2FA</span></div>
        </div>
        <div class="modern-dropdown-item" onclick="openConnectedDevicesModal(true)">
          <div class="dd-item-left"><i class="ri-computer-line" style="color:#22c55e;"></i> <span>Connected Logins</span></div>
        </div>
        <div class="modern-dropdown-item" onclick="openCloudDriveManager(true)">
          <div class="dd-item-left"><i class="ri-cloud-line" style="color:var(--accent);"></i> <span>Cloud Drive Manager</span></div>
        </div>
        <div class="modern-dropdown-item" onclick="openHelpCenterModal()">
          <div class="dd-item-left"><i class="ri-book-read-line" style="color:#f59e0b;"></i> <span>Help Center &amp; Guide</span></div>
        </div>
        <div class="modern-dropdown-item" onclick="confirmLogoutModal()" style="color: #ef4444; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 9px;">
          <div class="dd-item-left"><i class="ri-logout-box-r-line" style="color:#ef4444;"></i> <span>Logout Vault</span></div>
        </div>
      </div>
    </div>
  </div>
</header>
