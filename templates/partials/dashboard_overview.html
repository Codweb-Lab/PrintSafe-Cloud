<!-- 📊 PRINTSAFE CLOUD — MODULAR DASHBOARD OVERVIEW (dashboard_overview.html) -->
<section id="cloudly-dashboard-view" class="ps-dash-wrapper" style="display: grid;">
  <div class="ps-dash-main-col">
    <!-- Welcome Banner + Top Actions -->
    <div class="ps-dash-hero">
      <div>
        <h1 class="ps-dash-title" id="dash-welcome-heading">Welcome Back!</h1>
        <p class="ps-dash-subtitle">Access your files, manage your multi-cloud storage, and stay organized with ease.</p>
      </div>
      <div class="ps-dash-hero-actions">
        <button type="button" class="ps-dash-btn-outline master-only-nav" onclick="openDashCreateFolderPrompt()">
          <i class="ri-folder-add-line"></i> New Folder
        </button>
        <button type="button" class="ps-dash-btn-primary" onclick="switchToVaultExplorerFromDash('all')">
          <i class="ri-folder-shield-2-line"></i> Open Vault
        </button>
      </div>
    </div>

    <!-- Combined Cloud & Print Queue Overview Cards -->
    <div class="ps-dash-stats-grid" id="dash-provider-cards"></div>

    <!-- Mounted Folders Section (Theme-Aware Folder Cards) -->
    <div class="ps-dash-section">
      <div class="ps-dash-section-head">
        <h3>Mounted Folders</h3>
        <button type="button" class="ps-dash-link-btn" onclick="switchToVaultExplorerFromDash('all')">See More</button>
      </div>
      <div class="ps-dash-folders-grid" id="dash-folders-grid"></div>
    </div>

    <!-- Recent Compact Grid Section (Folders & Files with Date/Time) -->
    <div class="ps-dash-section">
      <div class="ps-dash-section-head">
        <h3>Recent</h3>
        <button type="button" class="ps-dash-link-btn" onclick="switchToVaultExplorerFromDash('all')">See More</button>
      </div>
      <div class="ps-dash-recent-grid" id="dash-recent-grid"></div>
    </div>
  </div>

  <!-- Right Column: Combined Cloud Storage Donut Chart & File Breakdown -->
  <aside class="ps-dash-right-col">
    <div class="ps-dash-card ps-dash-chart-card">
      <div class="ps-dash-section-head" style="margin-bottom: 10px;">
        <h3>Storage Details</h3>
        <span class="version-pill" id="dash-total-items-pill">0 Items</span>
      </div>

      <!-- SVG Multi-Segment Combined Storage Donut Chart -->
      <div class="ps-donut-box">
        <svg viewBox="0 0 180 180" class="ps-donut-svg">
          <circle cx="90" cy="90" r="68" fill="none" stroke="var(--border)" stroke-width="18" />
          <circle id="donut-seg-google" cx="90" cy="90" r="68" fill="none" stroke="#7CA1FF" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 427" transform="rotate(-90 90 90)" />
          <circle id="donut-seg-onedrive" cx="90" cy="90" r="68" fill="none" stroke="#FF7DA0" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 427" transform="rotate(-90 90 90)" />
          <circle id="donut-seg-sftp" cx="90" cy="90" r="68" fill="none" stroke="#9878DD" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 427" transform="rotate(-90 90 90)" />
          <circle id="donut-seg-local" cx="90" cy="90" r="68" fill="none" stroke="#FF8132" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 427" transform="rotate(-90 90 90)" />
        </svg>
        <div class="ps-donut-center">
          <div class="ps-donut-big" id="dash-donut-total-used">0 B</div>
          <div class="ps-donut-sub" id="dash-donut-total-cap">of 0 B</div>
        </div>
      </div>

      <!-- Breakdown Rows -->
      <div class="ps-breakdown-list" id="dash-breakdown-list"></div>
    </div>

    <!-- Quick Insights Card -->
    <div class="ps-dash-card ps-dash-insight-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div class="ps-insight-icon"><i class="ri-shield-flash-fill"></i></div>
        <div>
          <div style="font-weight:700;font-size:13.5px;color:var(--text-title);">Multi-Cloud Sync Active</div>
          <div style="font-size:11.5px;color:var(--text-sub);" id="dash-connected-drives-summary">0 Drives Linked</div>
        </div>
      </div>
      <div class="ps-dash-bars-deco">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <button type="button" class="ps-dash-cta-full master-only-nav" onclick="openCloudDriveManager(true)">
        <i class="ri-cloud-line"></i> Manage Connected Drives
      </button>
    </div>
  </aside>
</section>
